<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Redirection vers Fiverr</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F7F6F5; color: #12241D; font: 16px/1.5 "Segoe UI", system-ui, sans-serif; padding: 0 16px; }
  p { text-align: center; }
  a { color: #0A4533; font-weight: 700; }

/* Couleurs : vert forêt #0A4533 et blanc cassé #F7F6F5 pour l'ambiance, vert lime #C8F366 réservé au bouton d'action */
.btn.solid,.cta-main,.btn-b.clair{background:#C8F366;color:#0A4533}
.btn.solid:hover,.cta-main:hover,.btn-b.clair:hover{background:#B6E54C;color:#0A4533}
.head-cta.btn.solid,.head-cta{background:#0A4533;color:#F7F6F5}
.head-cta:hover{background:#0E5641;color:#F7F6F5}
.lien-row{border-color:#0A4533}
.lien-row:focus-within{box-shadow:0 0 0 4px rgba(10,69,51,.15),var(--shadow)}
.apercu-tag{background:#F7F6F5;color:#0A4533;border:1px solid #E4E2DC}
.hero{background:radial-gradient(circle at 88% 0%,rgba(247,246,245,.09),transparent 45%),linear-gradient(160deg,#0A4533 0%,#0D513D 100%);border-color:#0A4533;color:#F7F6F5}
.hero h1,.hero h1 em{color:#F7F6F5;background:none}
.hero h1 em{color:rgba(247,246,245,.72)}
.hero .lead,.hero label,.hero .lien-ou,.hero .lien-bloc label{color:rgba(247,246,245,.85)}
.hero .pastille{background:rgba(247,246,245,.08);border-color:rgba(247,246,245,.28);color:#F7F6F5}
.hero .pastille::before,.hero .quota::before{background:#F7F6F5}
.hero .quota{background:rgba(247,246,245,.1);color:#F7F6F5}
.hero .lien-row{border-color:transparent}
.hero .lien-txt,.hero a:not(.btn):not(.cta-main){color:#F7F6F5}
.hero .lien-msg{color:#F7F6F5}.hero .lien-msg.err{color:#FFB8AD}
.hero .mc>summary{color:#F7F6F5}.hero .mc>summary span{color:rgba(247,246,245,.7)}
.hero .confiance{background:rgba(247,246,245,.06);border-top-color:rgba(247,246,245,.16);color:rgba(247,246,245,.85)}
.hero .confiance svg,.hero .confiance strong,.hero .confiance .etoiles{color:#F7F6F5}
.hero .btn:not(.solid){background:transparent;color:#F7F6F5;border-color:rgba(247,246,245,.5)}
.cta{background:#0A4533;border-color:#0A4533;color:#F7F6F5}
.cta .verdict,.cta>p{color:#F7F6F5}
.cta .profil{color:#12241D}
.cta .cta-mail{color:#F7F6F5}
.etapes li::before{background:#0A4533;color:#F7F6F5}
.hero .apercu-carte,.hero .carte-id,.hero .apercu-carte .v,.hero .id-nom{color:#12241D}
/* Correctifs du 27/11 : boutons des encadrés, avis longs */
.cta .btn{background:#C8F366;color:#0A4533;border-color:#C8F366}
.cta .btn:hover{background:#B6E54C;border-color:#B6E54C}
.cta .btn.ligne{background:transparent;color:#F7F6F5;border-color:rgba(247,246,245,.5)}
.cta .cta-titre{color:#F7F6F5}
.cta a:not(.btn):not(.cta-main):not(.cta-mail){color:#F7F6F5}
.avis-txt{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.avis-suite{font-size:13.5px;font-weight:700;color:var(--accent)}
</style>
</head>
<body>
<p>Redirection vers l'offre Fiverr… / Redirecting to Fiverr…<br>
<a id="lien" href="https://fr.fiverr.com/antoine_spad/optimize-the-seo-of-your-amazon-france-product-listings">Continuer / Continue</a></p>
<script>
// Lien Fiverr des mails de prospection : enregistre le clic (référence de la fiche),
// puis redirige vers le gig. Le prospect qui a cliqué n'est pas relancé.
(function () {
  var FIVERR = "https://fr.fiverr.com/antoine_spad/optimize-the-seo-of-your-amazon-france-product-listings";
  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyqGo0wuLbb8Wuq9jI9IRqt3RuAlTE8tsUfMPQfXyq_CP1qxp3nZkdEzLvoDfpuhdg5/exec";
  var fiche = "", src = "";
  try {
    var p = new URLSearchParams(location.search);
    fiche = (p.get("fiche") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 10);
    src = (p.get("src") || "").slice(0, 40);
  } catch (e) {}
  try {
    var corps = new URLSearchParams({ type: "evenement", evenement: "clic Fiverr (mail)",
      detail: ["mail", fiche, src].join(" · "), provenance: document.referrer || "mail" });
    if (!(navigator.sendBeacon && navigator.sendBeacon(SCRIPT_URL, corps))) {
      fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", keepalive: true, body: corps });
    }
  } catch (e) {}
  setTimeout(function () { location.replace(FIVERR); }, 150);
})();
</script>
</body>
</html>
